name: Clover Networks
description: >-
  Clover Network Inc. was a Silicon Valley mobile-payments startup that launched
  publicly in March 2012 with a one-click, app-based checkout network aiming to
  complete a payment in under five seconds using a phone number and PIN, charging
  merchants a 3% per-transaction fee and seeding adoption with a developer fund
  and instant-refund incentives. It raised $5.8M from Andreessen Horowitz and
  Sutter Hill Ventures and was acquired by First Data on December 28, 2012. The
  Clover name and technology were carried forward by First Data into the Clover
  point-of-sale platform, which is now owned by Fiserv and covered separately in
  the API Evangelist network by the `clover` repository. This entity is a
  historical a16z portfolio lead and no longer operates as an independent company
  or publishes its own developer surface.
